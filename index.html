<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Skyward Glide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(10,14,30,.42);--line:rgba(255,255,255,.18);--txt:#fff;--acc:#ffcf3a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05070f;font-family:'Fredoka',system-ui,sans-serif;color:var(--txt);user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
#hud{position:fixed;inset:0;pointer-events:none}
#hud .top{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pill{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
#lvlName{font-weight:700;font-size:15px;letter-spacing:.04em}
#lvlSub{font-size:12px;opacity:.75}
#score{font-size:26px;font-weight:700;text-align:right;line-height:1.05}
#scoreLbl{font-size:10px;opacity:.7;text-align:right;letter-spacing:.14em}
#lives{font-size:16px;letter-spacing:2px;margin-top:3px;text-align:right}
.hbtns{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;pointer-events:auto}
.ibtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:#fff;font-size:15px;backdrop-filter:blur(8px)}
#progWrap{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 32px))}
#progBar{height:8px;border-radius:8px;background:rgba(255,255,255,.2);overflow:hidden;position:relative;box-shadow:0 1px 6px rgba(0,0,0,.3)}
#progFill{height:100%;width:0;background:linear-gradient(90deg,#ffe066,#ff7a3d);border-radius:8px}
.cpTick{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.75)}
#progInfo{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#toast{position:absolute;top:20%;left:50%;transform:translate(-50%,0) scale(.85);font-size:clamp(22px,4.6vw,46px);font-weight:700;letter-spacing:.06em;text-align:center;opacity:0;transition:opacity .35s,transform .35s;text-shadow:0 3px 18px rgba(0,0,0,.55);white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast small{display:block;font-size:.42em;font-weight:500;letter-spacing:.12em;opacity:.9;margin-top:4px}
#bonus{position:absolute;top:58%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:700;opacity:0;text-shadow:0 2px 10px rgba(0,0,0,.6);white-space:nowrap}
#bonus.go{animation:bon .9s ease-out}
@keyframes bon{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
#flash,#splash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
#flash{background:radial-gradient(ellipse at center,rgba(255,0,0,0) 35%,rgba(255,30,30,.6))}
#splash{background:radial-gradient(ellipse at center,rgba(255,255,255,.05) 20%,var(--splash,rgba(120,200,255,.55)))}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,6,16,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px;overflow:auto}
.panel{background:rgba(12,16,34,.72);border:1px solid var(--line);border-radius:22px;padding:26px;max-width:960px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-align:center;margin:auto}
.panel.small{max-width:420px}
h1.title{font-size:clamp(38px,7vw,72px);font-weight:700;letter-spacing:.04em;line-height:1;background:linear-gradient(90deg,#ffe066,#ff7a3d 40%,#ff4fd8 70%,#5ad1ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 20px rgba(255,120,60,.25))}
.sub{opacity:.8;margin:8px 0 20px;font-size:15px}
h2{font-size:32px;margin-bottom:6px}
#levels{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.card{position:relative;border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:12px 12px 10px;text-align:left;color:#fff;min-height:118px;overflow:hidden;transition:transform .18s,box-shadow .18s;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.card:hover,.card:focus-visible{transform:translateY(-4px) scale(1.03);box-shadow:0 12px 30px rgba(0,0,0,.45);outline:none}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.55));pointer-events:none}
.card>*{position:relative;z-index:1}
.card .num{font-size:30px;font-weight:700;line-height:1;opacity:.95;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.card .nm{font-weight:600;font-size:14px;margin-top:22px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.card .tg{font-size:11px;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.card .best{position:absolute;top:10px;right:10px;font-size:11px;background:rgba(0,0,0,.35);padding:2px 7px;border-radius:10px}
.controls{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin-top:20px;font-size:13px;opacity:.85}
kbd{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:1px 6px;font-family:inherit;font-size:12px}
.btn{border:none;border-radius:14px;padding:12px 22px;font-size:17px;font-weight:600;color:#1a1020;background:linear-gradient(90deg,#ffe066,#ff9a3d);margin:6px;box-shadow:0 6px 18px rgba(255,140,60,.3);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}
.stat{background:rgba(255,255,255,.07);border-radius:12px;padding:10px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;opacity:.75}
@media (max-width:760px){#levels{grid-template-columns:repeat(2,1fr)}.panel{padding:18px}.card{min-height:100px}.card .nm{margin-top:14px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="splash"></div>

<div id="hud" class="hidden">
  <div class="top">
    <div class="pill"><div id="lvlName">Level</div><div id="lvlSub">—</div></div>
    <div class="pill">
      <div id="scoreLbl">SCORE</div>
      <div id="score">0</div>
      <div id="lives"></div>
      <div class="hbtns"><button class="ibtn" id="bMute" title="Sound (M)">🔊</button><button class="ibtn" id="bPause" title="Pause (P)">⏸</button></div>
    </div>
  </div>
  <div id="toast"></div>
  <div id="bonus"></div>
  <div id="progWrap">
    <div id="progBar"><div id="progFill"></div></div>
    <div id="progInfo"><span id="pPct">0%</span><span id="pSpd">0 km/h</span><span id="pTime">5:00 left</span></div>
  </div>
</div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1 class="title">SKYWARD GLIDE</h1>
    <p class="sub">Ten worlds. Five minutes each. Glide down, thread the tunnels, punch through the waterfalls.</p>
    <div id="levels"></div>
    <div class="controls">
      <span><kbd>←</kbd><kbd>→</kbd>/<kbd>A</kbd><kbd>D</kbd> steer</span>
      <span><kbd>↑</kbd><kbd>↓</kbd>/<kbd>W</kbd><kbd>S</kbd> climb / dive</span>
      <span>Drag (mouse or touch) to steer</span>
      <span><kbd>P</kbd> pause</span><span><kbd>M</kbd> sound</span><span><kbd>I</kbd> invert up/down</span>
    </div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="panel small">
    <h2>Paused</h2>
    <p class="sub" id="pauseInfo"></p>
    <button class="btn" id="bResume">Resume</button><br>
    <button class="btn ghost" id="bRestart">Restart level</button>
    <button class="btn ghost" id="bMenu1">Level select</button>
  </div>
</div>

<div id="crash" class="overlay hidden">
  <div class="panel small">
    <h2>Crashed!</h2>
    <p class="sub" id="crashInfo">Out of wings.</p>
    <button class="btn" id="bRetry">Retry from checkpoint</button><br>
    <button class="btn ghost" id="bMenu2">Level select</button>
  </div>
</div>

<div id="done" class="overlay hidden">
  <div class="panel small">
    <h2 id="doneTitle">Level Complete!</h2>
    <p class="sub" id="doneSub"></p>
    <div class="stats" id="doneStats"></div>
    <button class="btn" id="bNext">Next level</button><br>
    <button class="btn ghost" id="bReplay">Replay</button>
    <button class="btn ghost" id="bMenu3">Level select</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

// ---------------------------------------------------------------- noise & path
function hash(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967295; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }

const PATH = {};

function pathY(z) { return z * PATH.s + PATH.s * .6 / PATH.df * Math.sin(z * PATH.df + .7); }
function slopeAt(z) { return PATH.s * (1 + .6 * Math.cos(z * PATH.df + .7)); }
function diveBoost(z) { return .85 + .25 * slopeAt(z) / PATH.s; }

      case 'wall': if (crossed) { const ok = inHoles(o.holes);
          if (!ok) { hurt(); if (o.tunnel) { o.tunnel.missed = true; const c = o.tunnel.cen(pz); P.ox = c.x; P.oy = c.y; P.vx = P.vy = 0; } }
          else if (o.fall) { P.falls++; score(150, o.fall.name, '#9fe0ff'); sfx.splash(); $('splash').style.setProperty('--splash', 'rgba(' + new THREE.Color(o.fall.color).toArray().map(v => v * 255 | 0).join(',') + ',.55)'); flash('splash', 450); } }
        if (o.tunnel && !o.warned && o.z > pz - 300) { o.warned = true; toast(o.tunnel.name, 'Thread the glowing ring!', hex(visAt(o.z).tunnel.glow)); }
        if (o.fall && !o.warned && o.z > pz - 260) { o.warned = true; toast(o.fall.name, 'Glide through the falls!', hex(o.fall.color)); }
        break;
      case 'tunnel': if (pz < o.z && pz > o.zEnd) { const c = o.cen(pz), dx = P.ox - c.x, dy = P.oy - c.y, dd = Math.hypot(dx, dy), lim = o.R - PR;
          if (dd > lim) { P.ox = c.x + dx / dd * lim; P.oy = c.y + dy / dd * lim; P.vx *= .5; P.vy *= .5; if (simT - (o.scr || 0) > .25) { o.scr = simT; sfx.scrape(); shake = Math.max(shake, .15); } } }
        if (z0 >= o.zEnd && z1 < o.zEnd && !o.done) { o.done = true; if (!o.missed) { P.tunnels++; score(250, 'Tunnel clear', '#9cf'); sfx.tunnel(); } } break;
      case 'cp': if (crossed) { P.checkpoint = -o.z; P.cpScore = P.score; toast('CHECKPOINT', Math.round(P.checkpoint / LV.length * 100) + '% complete', '#7dffc0', 1600); sfx.cp(); const p = o.mesh.position; firework(p.x - W, p.y + maxY, p.z - 20, 0x60ffb0); firework(p.x + W, p.y + maxY, p.z - 20, 0xffe060); } break;
    }
  }
}

// ---------------------------------------------------------------- camera & glider
function placeCamera(dt, snap) {
  const z = -P.dist, a = snap ? 1 : Math.min(1, dt * 5);
  camOff.x += (P.ox * .82 - camOff.x) * a; camOff.y += (P.oy * .8 + 6.2 - camOff.y) * a;
  const cz = z + 12; camera.position.set(pathX(cz) + camOff.x, pathY(cz) + camOff.y, cz);
  const lz = z - 30; camera.lookAt(pathX(lz) + P.ox * .95, lerp(pathY(lz), pathY(z), .6) + P.oy * .95 - 1.5, lz);
  camera.rotateZ(glider.rotation.z * .25);
  if (shake > 0) { camera.position.x += rand(-1, 1) * shake; camera.position.y += rand(-1, 1) * shake; }
  skyGroup.position.copy(camera.position);
  disc.lookAt(camera.position);
}
function updateGlider(dt) {
  const z = -P.dist, maxV = 28 + LI * 1.2;
  glider.position.set(pathX(z) + P.ox, pathY(z) + P.oy, z);
  const sp = Math.max(10, P.speed), fx = (pathX(z - 2) - pathX(z)) / 2 + P.vx / sp, fy = (pathY(z - 2) - pathY(z)) / 2 + P.vy / sp;
  const a = Math.min(1, dt * 8);
  if (state === 'crash') { glider.rotation.z += dt * 7; glider.rotation.x += dt * 2; }
  else { glider.rotation.y = lerp(glider.rotation.y, Math.atan(-fx), a); glider.rotation.x = lerp(glider.rotation.x, Math.atan(fy) * .9 + Math.sin(simT * 1.7) * .03, a); glider.rotation.z = lerp(glider.rotation.z, -P.vx / maxV * .9 + Math.sin(simT * 1.3) * .04, a); }
  glider.visible = !(P.invuln > 0 && state === 'play' && ((simT * 14) | 0) % 2);
  sun.position.copy(glider.position).addScaledVector(sun.userData.dir || _v.set(0, 1, 0), 200); sun.target.position.copy(glider.position);
}

// ---------------------------------------------------------------- main update
function update(dt) {
  simT += dt; fallU.t.value = simT;
  const playing = state === 'play';
  const prog = clamp(P.dist / LV.length, 0, 1);
  let tgt = (demo ? LV.speed * .8 : LV.speed * (1 + .15 * prog)) * diveBoost(-P.dist);
  if (state === 'crash') tgt = 0; if (state === 'done') tgt = LV.speed * .6;
  P.slow = Math.max(0, P.slow - dt * 1.1);
  P.speed += (tgt * (1 - .4 * P.slow) - P.speed) * Math.min(1, dt * (state === 'crash' ? 1.5 : 2));
  const z0 = -P.dist; P.dist += P.speed * dt; const z1 = -P.dist;
  const maxV = 28 + LI * 1.2;
  if (playing) {
    let ix = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    let iy = (keys.ArrowUp || keys.KeyW ? 1 : 0) - (keys.ArrowDown || keys.KeyS ? 1 : 0);
    if (drag) { const s = Math.min(innerWidth, innerHeight) * .12; ix = clamp((drag.cx - drag.x) / s, -1, 1); iy = clamp(-(drag.cy - drag.y) / s, -1, 1); }
    if (invertY) iy = -iy;
    P.ix += (ix - P.ix) * Math.min(1, dt * 9); P.iy += (iy - P.iy) * Math.min(1, dt * 9);
    P.vx += (P.ix * maxV - P.vx) * Math.min(1, dt * 4.5); P.vy += (P.iy * maxV * (P.iy > 0 ? .5 : .9) - 3 - P.vy) * Math.min(1, dt * 4.5);
  } else if (state === 'crash') { P.vy -= 18 * dt; P.vx *= 1 - dt; }
  else { const tx = Math.sin(simT * .45) * 10, ty = (minY + maxY) / 2 + Math.sin(simT * .33) * 6; P.vx = (tx - P.ox) * 1.4; P.vy = (ty - P.oy) * 1.4; }
  P.ox += P.vx * dt; P.oy += P.vy * dt;
  if (state !== 'crash') { if (P.ox > W) { P.ox = W; P.vx = Math.min(P.vx, 0); } if (P.ox < -W) { P.ox = -W; P.vx = Math.max(P.vx, 0); }
    if (P.oy > maxY) { P.oy = maxY; P.vy = Math.min(P.vy, 0); } if (P.oy < minY) { P.oy = minY; P.vy = Math.max(P.vy, 0); } }
  else P.oy = Math.max(P.oy, minY - 3);

  while (nextSpawnZ > z1 - AHEAD) spawnNext();
  if (multi) { const s = subAt(P.dist); if (s !== curSub) { curSub = s; VIS = visAt(z1); applyVisual(VIS, false); envTimer = 1.8; if (playing) { toast('DIMENSION SHIFT', VIS.name, hex(VIS.tunnel.glow)); sfx.shift(); } } }
  if (envTimer > 0 && (envTimer -= dt) <= 0) buildEnv();

  updateObjects(dt, z0, z1, playing);
  lerpVisual(dt);
  updateGlider(dt);
  shake = Math.max(0, shake - dt * 1.5);
  placeCamera(dt, false);
  camera.fov = lerp(camera.fov, 66 + (P.speed - 38) * .16 + slopeAt(-P.dist) * 8 + (playing && P.iy < -.5 ? 3 : 0), Math.min(1, dt * 2)); camera.updateProjectionMatrix();
  updateChunks(camera.position.z);
  updateParticles(dt); updateFireworks(dt); updateTrails(false);
  if (VIS.fireworks && Math.random() < dt * 1.3) skyFirework(state === 'play');
  P.invuln = Math.max(0, P.invuln - dt);
  if (AC && windGain) { windGain.gain.value = lerp(windGain.gain.value, state === 'paused' ? 0 : clamp(P.speed / 90, .05, 1) * .22, .05); windFilter.frequency.value = 300 + P.speed * 9; }
  musicTick();
  if (playing) { P.score += P.speed * dt * .1; updateHud(); if (P.dist >= LV.length) completeLevel(); }
}

// ---------------------------------------------------------------- menus & flow
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
const getBest = i => +(store('sg_best_' + i) || 0), setBest = (i, v) => store('sg_best_' + i, v);
const setUnlocked = i => { if (i > +(store('sg_unlock') || 0)) store('sg_unlock', i); };
function buildMenu() { const box = $('levels'); box.innerHTML = '';
  LEVELS.forEach((L, i) => { const b = document.createElement('button'); b.className = 'card'; const best = getBest(i);
    const c1 = L.subs ? 'linear-gradient(135deg,#ff4fd8,#5ad1ff,#ffe066,#40e070)' : `linear-gradient(160deg,${hex(L.sky[0])},${hex(L.sky[1])} 70%,${hex(L.pal.low)})`;
    b.style.background = c1; b.innerHTML = `<div class="num">${i + 1}</div>${best ? `<div class="best">★ ${best.toLocaleString()}</div>` : ''}<div class="nm">${L.name}</div><div class="tg">${L.tag}</div>`;
    let hov; b.onmouseenter = () => { hov = setTimeout(() => { if (state === 'menu' && LI !== i) setupLevel(i, true); }, 350); }; b.onmouseleave = () => clearTimeout(hov);
    b.onclick = () => startLevel(i); box.appendChild(b); }); }
function startLevel(i) { initAudio(); ['menu', 'pause', 'crash', 'done'].forEach(id => show(id, false)); setupLevel(i, false); state = 'play'; show('hud', true);
  $('lvlName').textContent = `${i + 1}. ${LV.name}`; $('lvlSub').textContent = LV.tag; lastHud = '';
  $('progBar').querySelectorAll('.cpTick').forEach(e => e.remove()); for (let k = 1; k < 5; k++) { const t = document.createElement('div'); t.className = 'cpTick'; t.style.left = k * 20 + '%'; $('progBar').appendChild(t); }
  toast(LV.name, LV.tag, '#fff', 2600); }
function toMenu() { ['pause', 'crash', 'done', 'hud'].forEach(id => show(id, false)); buildMenu(); setupLevel(LI, true); state = 'menu'; show('menu', true); }
function togglePause() { if (state === 'play') { state = 'paused'; $('pauseInfo').textContent = `${LV.name} — ${Math.floor(P.dist / LV.length * 100)}%`; show('pause', true); }
  else if (state === 'paused') { state = 'play'; show('pause', false); } }
$('bResume').onclick = togglePause; $('bPause').onclick = togglePause; $('bMute').onclick = toggleMute;
$('bRestart').onclick = () => startLevel(LI);
$('bRetry').onclick = () => { show('crash', false); P.lives = 3; P.score = P.cpScore; resetRun(P.checkpoint); state = 'play'; toast('Back at checkpoint', 'Go again!', '#7dffc0'); };
$('bNext').onclick = () => startLevel(Math.min(LI + 1, LEVELS.length - 1));
$('bReplay').onclick = () => startLevel(LI);
['bMenu1', 'bMenu2', 'bMenu3'].forEach(id => $(id).onclick = toMenu);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && !window.SG_NOPAUSE) togglePause(); });

// expose for debugging / testing
window.SG = { P, LEVELS, startLevel, togglePause, resetRun, get state() { return state; }, get OB() { return OB; }, get LV() { return LV; } };

buildMenu(); setupLevel(0, true);
let last = performance.now();
function frame(now) { requestAnimationFrame(frame); const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state !== 'paused') update(dt); else placeCamera(dt, false);
  renderer.render(scene, camera); }
requestAnimationFrame(frame);
})();
</script>
</body>
